<div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 transition-opacity duration-500 opacity-0 animate-fade-in">
  <div class="modal-container bg-[#0575A6] rounded-xl overflow-hidden shadow-lg transform scale-95 transition-transform duration-500 ease-in-out">
    <!-- contenido -->
    <div class="modal-content text-center text-gray-100">
      <div class="flex justify-center mb-5">
        <!-- <img src="assets/iconModals/petFinded.gif" class="w-24 h-24" alt="nice"> -->
      </div>
      <h2 class="text-3xl mb-8">Selecciona el tipo de publicación</h2>
      <br>
      <div class="flex justify-between gap-4 mb-4">
        <button 
          (click)="selectPostType('adopcion')" 
          class="button-modal-post-secundary text-xl font-semibold bg-[#126b93] hover:bg-[#0d5572] px-6 py-3 rounded-lg transition-all duration-300 transform hover:scale-105"
        >
          Adopción
        </button>
        <button 
          (click)="selectPostType('perdida')" 
          class="button-modal-post-secundary text-xl font-semibold bg-[#126b93] hover:bg-[#0d5572] px-6 py-3 rounded-lg transition-all duration-300 transform hover:scale-105"
        >
          Pérdida
        </button>
      </div>
    </div>
    <!-- botones -->
    <div class="pt-5 pb-6 px-6 bg-[#126b93] flex justify-center gap-4">
      <button
        class="py-3 px-5 font-semibold leading-6 text-gray-200 bg-gray-500  rounded-lg transition-all duration-300 transform hover:scale-105 hover:bg-red-500"
        (click)="onClose()"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>

<style>
  /* Animación fade-in */
  @keyframes fade-in {
    0% {
      opacity: 0;
      transform: scale(1.1);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  .animate-fade-in {
    animation: fade-in 0.5s ease-out forwards;
  }
</style>
