<div class="div-modal-post-main fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center">
    <div class="div-modal-post-secundary bg-white p-6 rounded-lg text-center w-2/6">
      <h2 class="text-xl font-semibold mb-8">Selecciona el tipo de publicación</h2>
      <div class="flex justify-between gap-4 mb-4">
        <button (click)="selectPostType('adopcion')" class="button-modal-post-secundary px-4 py-2 ml-16 text-white rounded">
          Adopción
        </button>
        <button (click)="selectPostType('perdida')" class="button-modal-post-secundary px-4 py-2 mr-16 text-white rounded">
          Pérdida
        </button>
      </div>
      <button (click)="onClose()" class="mt-4 px-6 py-2 bg-red-600 text-white rounded hover:bg-red-700">
        Cerrar
      </button>
    </div>
  </div>
