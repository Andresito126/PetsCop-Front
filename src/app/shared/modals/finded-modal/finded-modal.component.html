<div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 transition-opacity duration-500 opacity-0 animate-fade-in">
    <div class="modal-container bg-[#0575A6] rounded-xl overflow-hidden shadow-lg transform scale-95 transition-transform duration-500 ease-in-out">
      <!-- contenido -->
      <div class="modal-content text-center text-gray-100">
        <div class="flex justify-center mb-5">
          <!-- <img src="assets/iconModals/petFinded.gif" class="w-24 h-24" alt="nice"> -->
        </div>
        <h4 class="text-xl font-semibold mb-5">
          ¡ENHORABUENA!
          <br>
          Nos alegramos que hayas encontrado a tu mascota, eso es una gran noticia.
          <br>
          ¿No te gustaría dejar un mensaje para aquellos que te ayudaron en esta búsqueda?
        </h4>
        <textarea
          class="modal-textarea"
        >Gracias a todos por su cooperación, ahora mi mascota se encuentra conmigo</textarea>
      </div>
      <!-- botones -->
      <div class="pt-5 pb-6 px-6 bg-[#126b93] flex justify-center gap-4">
        <button
          class="py-3 px-5 font-semibold leading-6 text-gray-200 bg-gray-500 hover:bg-gray-400 rounded-lg transition duration-200"
          (click)="closeFindedModal()"
        >
          Cancel
        </button>
        <button
          class="py-3 px-5 font-semibold leading-6 text-blue-50 bg-[#0575A6] hover:bg-[#3292b8] hover:text-white rounded-lg transition duration-200"
          (click)="sendFindedModal()"
        >
          Confirm
        </button>
      </div>
    </div>
  </div>
  

  <style>
    @keyframes fade-in {
      0% {
        opacity: 0;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
  </style>
