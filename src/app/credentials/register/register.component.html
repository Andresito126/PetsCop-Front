<div
  class="mx-auto max-w-screen-xl px-4 py-16 sm:px-6 lg:px-8 flex justify-center"
>
  <div class="w-full sm:w-1/2">

    <form class="mb-0 mt-6 space-y-4 rounded-lg p-4 shadow-lg sm:p-6 lg:p-8">
      <!-- FORMULARIO DE USARIO NORMAL -->
       
      <div *ngIf="choosenUser === 'Normal'">
        <h1 class="text-center text-2xl font-bold text-slate-800 sm:text-3xl">
          Registro
        </h1>
        <div>
          <input type="file" (change)="listenImage($event)">
          <label
            for="name"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Nombre</label
          >
          <input
            type="text"
            id="name"
            [(ngModel)]="new_user_normally.first_name"
            name="name"
            placeholder="Ingresa tu nombre"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>

        <div>
          <label
            for="last_name"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Apellidos</label
          >
          <input
            type="text"
            id="last_name"
            [(ngModel)]="new_user_normally.last_name"
            name="last_name"
            placeholder="Ingresa tu apellido paterno"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>

        <div>
          <label
            for="birthdate"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Fecha de Nacimiento</label
          >
          <input
            type="date"
            id="birthdate"
            [(ngModel)]="new_user_normally.birthdate"
            name="birthdate"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>

        <div>
          <label
            for="email"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Correo Electrónico</label
          >
          <input
            type="email"
            id="email"
            [(ngModel)]="new_user_normally.email"
            name="email"
            placeholder="Ingresa tu correo electrónico"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>

        <div>
          <label
            for="password"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Contraseña</label
          >
          <input
            type="password"
            id="password"
            [(ngModel)]="new_user_normally.password_user"
            name="password"
            placeholder="Ingresa tu contraseña"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>

        <div>
          <label
            for="confirmPassword"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
            >Confirmar Contraseña</label
          >
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="compare_password"
            name="confirmPassword"
            placeholder="Confirma tu contraseña"
            class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            required
          />
        </div>
        
        <button
        type="button"
        class="mt-5 div-submit_color block w-full rounded-lg px-5 py-3 text-sm font-medium text-white"
          (click)="registerUser()"
        >
          Registrar Local
        </button>
      </div>

      <!-- FORMULARIO DE LOCAL -->
      <div *ngIf="choosenUser === 'Local'">
        <h1 class="text-center text-2xl font-bold text-slate-800 sm:text-3xl">
          Registro de un local
        </h1>
        <div>
          <!-- foto-->
          <div>
            <label
              for="mainPhoto"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Foto Principal</label
            >
            <input
              type="file"
              id="mainPhoto"
              (change)="listenImage($event)"
              placeholder="URL de la foto principal"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            />
          </div>

          <!-- nombre Local -->
          <div>
            <label
              for="name"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Nombre del Local</label
            >
            <input
              type="text"
              id="name"
              [(ngModel)]="new_local_service.name"
              name="name"
              placeholder="Ingresa el nombre del local"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <!-- descirpcion -->
          <div>
            <label
              for="description"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Descripción</label
            >
            <textarea
              id="description"
              [(ngModel)]="new_local_service.description"
              name="description"
              placeholder="Ingresa una descripción"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            ></textarea>
          </div>

          <!-- direccion -->
          <!-- <div>
    <label for="address" class="block mb-2 text-sm font-medium text-gray-900 dark:text-black">Dirección</label>
    <input
      type="text"
      id="address"
      [(ngModel)]="new_local_service.address"
      name="address"
      placeholder="Ingresa la dirección del local"
      class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
    />
  </div> -->

          <!-- correo -->
          <div>
            <label
              for="email"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Correo Electrónico</label
            >
            <input
              type="email"
              id="email"
              [(ngModel)]="new_local_service_as_user.email_user"
              name="email"
              placeholder="Ingresa el correo electrónico"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <!-- contra -->
          <div>
            <label
              for="password_LS"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Contraseña</label
            >
            <input
              type="password"
              id="password_LS"
              [(ngModel)]="new_local_service_as_user.password_user"
              name="password_LS"
              placeholder="Ingresa la contraseña"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <!-- confirmar contraseña  -->
          <div>
            <label
              for="confirmPassword"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Confirmar Contraseña</label
            >
            <input
              type="password"
              id="confirmPassword"
              [(ngModel)]="compare_password"
              name="confirmPassword"
              placeholder="Confirma la contraseña"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <button
          type="button"
          class="mt-5 div-submit_color block w-full rounded-lg px-5 py-3 text-sm font-medium text-white"
            (click)="registerLocalService()"
          >
            Registrar Local
          </button>
        </div>
      </div>

      <!-- FORMULARIO DE SERVICIO -->
      <div *ngIf="choosenUser === 'Service'">
        <h1 class="text-center text-2xl font-bold text-slate-800 sm:text-3xl">
          Registro de un servicio
        </h1>

        <div>
          <!-- foto-->
          <div>
            <label
              for="mainPhoto"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Foto Principal</label
            >
            <input
              type="file"
              id="mainPhoto"
              (change)="listenImage($event)"
              placeholder="URL de la foto principal"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
            />
          </div>

          <!-- nombre servicio -->
          <div>
            <label
              for="name"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Nombre del Local</label
            >
            <input
              type="text"
              id="name"
              [(ngModel)]="new_local_service.name"
              name="name"
              placeholder="Ingresa el nombre del local"

              required
            />
          </div>

          <!-- descirpcion -->
          <div>
            <label
              for="description"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Descripción</label
            >
            <textarea
              id="description"
              [(ngModel)]="new_local_service.description"
              name="description"
              placeholder="Ingresa una descripción"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            ></textarea>
          </div>

          <!-- correo -->
          <div>
            <label
              for="email"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Correo Electrónico</label
            >
            <input
              type="email"
              id="email"
              [(ngModel)]="new_local_service_as_user.email_user"
              name="email"

              required
            />
          </div>

          <!-- contra -->
          <div>
            <label
              for="password_LS"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Contraseña</label
            >
            <input
              type="password"
              id="password_LS"
              [(ngModel)]="new_local_service_as_user.password_user"
              name="password_LS"
              placeholder="Ingresa la contraseña"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <!-- confirmar contraseña  -->
          <div>
            <label
              for="confirmPassword"
              class="block mb-2 text-sm font-medium text-gray-900 dark:text-black"
              >Confirmar Contraseña</label
            >
            <input
              type="password"
              id="confirmPassword"
              [(ngModel)]="compare_password"
              name="confirmPassword"
              placeholder="Confirma la contraseña"
              class="mb-4 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5  dark:placeholder-gray-400 dark:text-black"
              required
            />
          </div>

          <button
          type="button"
          class="mt-5 div-submit_color block w-full rounded-lg px-5 py-3 text-sm font-medium text-white"
          (click)="registerLocalService()"
          >
            Registrar Servicio
          </button>
        </div>

      </div>

    </form>
  </div>
</div>
