<div class="card-container_main  p-4 rounded-lg border border-gray-300 bg-white shadow-lg  mt-10">
    <!-- nommbre y detalles -->
    <div class="card-header flex items-center mb-3">
        <img class="profile-image w-12 h-12 rounded-full border border-gray-300" src="https://via.placeholder.com/50" alt="Foto de perfil" />
        <div class="ml-4">
          <p class="text-sm font-semibold">Andre Julian Gutiérrez Alcazar</p>
          <p class="text-xs text-gray-500">24/10/2024 &nbsp; 10:12</p>
        </div>
        <button class="message-button ml-auto flex items-center px-4 py-1.5 rounded-md text-sm">
          <img class="h-7 w-7 mr-2" src="assets/posts/message.svg" alt="message-icon">
          Enviar mensaje
        </button>
      </div>
     
    <div class="card-container_info rounded-lg border border-gray-300 bg-white shadow-md p-5 flex justify-between items-start mb-4">
      <!-- img y boton contacto -->
        <div class="images-and-button flex flex-col ">
          <div class="images-container flex items-center">
            <!-- miniatutras -->
            <div class="thumbnails-container flex flex-col space-y-2 mr-4">
              <img
                *ngFor="let thumbnail of thumbnails"
                [src]="thumbnail"
                (click)="setMainImage(thumbnail)"
                class="thumbnail w-16 h-16 rounded-lg border border-gray-300 cursor-pointer"
                [class.border-blue-500]="thumbnail === mainImage"
                placeholder="https://via.placeholder.com/300'"
              />
            </div>
    
            <!-- img principal -->
            <div class="main-image-container">
              <img
                [src]="mainImage"
                class="main-image w-64 h-64 object-cover rounded-lg border border-gray-300"
                alt="Main Image"
              />
            </div>
          </div>
    
          <!-- boton -->
          <button
            class="contact-button text-white text-sm py-2 px-6 rounded-lg mt-4"
          >
            Contactarse con la persona
          </button>
        </div>
        <div class="info-pet-container-main">
          <div class="info-pet items-center">
            <div class="name-statu">
              <img src="" alt=""> 
              <h4>YAGO</h4>
              <img src="" alt="">
                        
            </div>
            <div class="button-to-change-info">

            </div>
            <div class="data-pet" >
            
            </div>
            <div class="description-of-event">

            </div>
          </div>
          <div class="info-pet-lost">
         
            <div class="cards-places" >

            </div>
            <div class="last-seen">

            </div>
          </div>
        </div>
    </div>

  
    <!-- Yorum Alanı -->
   <app-comments></app-comments>
    
</div>
