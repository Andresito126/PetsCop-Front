<!-- incio -->

<div
  class="card-container_main p-4 rounded-lg border border-gray-200 bg-white shadow-lg mt-10 "
>
  <!-- header del nombre, datos, publi y mandar mensaje -->
  <app-header-card
    [id_user]="post.id_user"
    [date]="date_publication"
    [time]="time_publication"

    [showInfoData]="true"
  ></app-header-card>
  <!-- info -->

  <app-info-card
  class="cursor-pointer"
  (click)="redirectDetailPost()"
  [lost_data]="post.loss_data"
  [reward]="post.reward"
  [gratitude]="post.gratitude"
  [type_post]="post.post_type"
  [pet]="post.basic_pet_information"
  [images]="post.basic_pet_information.photos"
  ></app-info-card>

  <!-- botones comentar y repostear -->
  <div class="flex items-center mt-4">
    <button
      class="comment-button flex items-center px-4 py-1.5 rounded-md mr-6"
    >
      <img
        class="h-7 w-7 mr-1"
        src="assets/posts/comment.svg"
        alt="message-icon"
      />
      Comentar
    </button>
    <button
      class="repost-button flex items-center px-4 py-1.5 rounded-md"
    >
      <img
        class="h-7 w-7 mr-1"
        src="assets/posts/repost.svg"
        alt="message-icon"
      />
      Repostear
    </button>

    <div *ngIf="post.post_type === 'Lost'" class="group flex gap-2 ml-auto" >
      <button class="icon-button edit-button" (click)="redirectEditPostLost()">
        <img src="assets/comments/edit.svg" alt="Editar" class="icon" />
      </button>
      <button class="icon-button delete-button">
        <img src="assets/comments/delete.svg" alt="Eliminar" class="icon" />
      </button>
    </div>

    <div  *ngIf="post.post_type === 'Adoption'" class="group flex gap-2 ml-auto" (click)="redirectEditPostAdoption()">
      <button class="icon-button edit-button">
        <img src="assets/comments/edit.svg" alt="Editar" class="icon" />
      </button>
      <button class="icon-button delete-button">
        <img src="assets/comments/delete.svg" alt="Eliminar" class="icon" />
      </button>
    </div>


   

  </div>
  
</div>
