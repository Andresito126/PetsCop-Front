<section class="relative mb-16">
  <!-- titulo y añadir comentario -->
  <div class="w-auto h-24 flex items-center justify-between px-6">
    <h2
    class="title-color_comments text-4xl font-bold font-manrope leading-normal"
    >
      Comentarios
    </h2>
    <!-- añadir comentario boton modal -->
    <button class="bookmarkBtn" (click)="openModal()">
      <span class="IconContainer">
        <svg fill="#0575A6" viewBox="0 0 512 512" height="1em">
          <path
            d="M123.6 391.3c12.9-9.4 29.6-11.8 44.6-6.4c26.5 9.6 56.2 15.1 87.8 15.1c124.7 0 208-80.5 208-160s-83.3-160-208-160S48 160.5 48 240c0 32 12.4 62.8 35.7 89.2c8.6 9.7 12.8 22.5 11.8 35.5c-1.4 18.1-5.7 34.7-11.3 49.4c17-7.9 31.1-16.7 39.4-22.7zM21.2 431.9c1.8-2.7 3.5-5.4 5.1-8.1c10-16.6 19.5-38.4 21.4-62.9C17.7 326.8 0 285.1 0 240C0 125.1 114.6 32 256 32s256 93.1 256 208s-114.6 208-256 208c-37.1 0-72.3-6.4-104.1-17.9c-11.9 8.7-31.3 20.6-54.3 30.6c-15.1 6.6-32.3 12.6-50.1 16.1c-.8 .2-1.6 .3-2.4 .5c-4.4 .8-8.7 1.5-13.2 1.9c-.2 0-.5 .1-.7 .1c-5.1 .5-10.2 .8-15.3 .8c-6.5 0-12.3-3.9-14.8-9.9c-2.5-6-1.1-12.8 3.4-17.4c4.1-4.2 7.8-8.7 11.3-13.5c1.7-2.3 3.3-4.6 4.8-6.9c.1-.2 .2-.3 .3-.5z"
          ></path>
        </svg>
      </span>
      <p class="text">Comentar</p>
    </button>

  </div>

  <div
    class="w-full max-w-7xl px-4 md:px-5 lg:px-5 mx-auto "
    *ngFor="let comment of comments"
  >
    <!-- principal -->
    <div
      class="w-full flex-col justify-start items-start lg:gap-14 gap-7 inline-flex "
    >
      <div class="w-full flex-col justify-start items-start gap-8 flex mb-10">
        <div
          class="w-full lg:p-8 p-5 bg-white rounded-3xl border border-gray-200 flex-col justify-start items-start flex"
        >
          <div class="w-full flex-col justify-start items-start gap-3.5 flex">
            <div class="w-full justify-between items-center inline-flex">
              <div class="justify-start items-center gap-2.5 flex">
                <div
                  class="w-10 h-10 bg-stone-300 rounded-full justify-start items-start gap-2.5 flex"
                >
                  <img
                    class="rounded-full object-cover"
                    [src]="comment.avatarUrl"
                    
                  />
                </div>
                <div
                  class="flex-col justify-start items-start gap-1 inline-flex"
                >
                  <!-- nombre -->
                  <h5 class="text-gray-900 text-sm font-semibold leading-snug">
                    {{ comment.username }}
                  </h5>
                  <!-- fecha de publi -->
                  <h6 class="text-gray-500 text-xs font-normal leading-5">
                    {{ comment.theDate | date : "short" }}
                  </h6>
                </div>
              </div>
              <!-- botnes de editar y eliminar en compoennte  -->
              <div *ngIf="comment.autor" class="group justify-end items-center flex gap-2">
                <!-- editar -->
                <button 
                  (click)="openModal(comment.id)" 
                  class="icon-button edit-button">
                  <img src="assets/comments/edit.svg" alt="Editar" class="icon">
                </button>
              
                <!-- eliminar -->
                <button 
                  (click)="deleteComment(comment.id)" 
                  class="icon-button delete-button">
                  <img src="assets/comments/delete.svg" alt="Eliminar" class="icon">
                </button>
              </div>
            </div>
            <p class="text-gray-800 text-sm font-normal leading-snug">
              {{ comment.content }}
            </p>
          </div>
        </div>

      </div>

    </div>
  </div>
        <!-- Modal comentario-->
        <app-comment-modal
        [showModal]="showCommentModal"
        [commentContent]="modalCommentContent"
        (commentSaved)="saveComment($event)"
        (modalClosed)="closeModal()"
      >
      </app-comment-modal>
</section>
