<div class="card-header flex items-center mb-3">
    <img class="profile-image w-12 h-12 rounded-full border border-gray-300" src="https://via.placeholder.com/50" alt="Foto de perfil" />
    <div class="ml-4">
      <p class="user-name font-bold">{{ user }}</p>
      <p class="post-date text-sm text-gray-500">{{ date }} {{time}}</p>
    </div>
    <button class="message-button ml-auto flex items-center px-4 py-1.5 rounded-md text-sm">
      <img class="h-7 w-7 mr-2" src="assets/posts/message.svg" alt="message-icon">
      Enviar mensaje
    </button>
  </div>
