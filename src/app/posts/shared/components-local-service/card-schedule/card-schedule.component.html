<div class="dropdown-horizontal-container">

    <input hidden id="dropdown-horizontal-checkbox" type="checkbox" />
    
    <label for="dropdown-horizontal-checkbox" class="dropdown-horizontal-trigger">
        HORARIOS
        <span class="dropdown-arrow"></span>
      </label>
  
    <!-- horarios -->
    <div class="dropdown-horizontal-list">
      <div
        *ngFor="let horario of openingHours"
        class="dropdown-horizontal-card"
      >
        <h3 class="dropdown-horizontal-card-title">{{ horario.day_care }}</h3>
        <p class="dropdown-horizontal-card-text">{{ horario.start_time }} - {{horario.end_time}}</p>
      </div>
    </div>
  </div>
