<main>
    <div class="message-to-edit">
        <p>Editando mensaje: {{edit_this_message.body_message}} </p>
        <button (click)="cancel()">Cancelar</button>
    </div>
    <div class="input-container">
        <input type="text" [(ngModel)]="edit_this_message.body_message" class="input-send">
        <button (click)="editMessage()" class="button-send"><i class="fa fa-paper-plane"></i></button>
    </div>
</main>
