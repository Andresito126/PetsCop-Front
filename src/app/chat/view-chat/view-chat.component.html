<main class="content">
    <div class="content_chat_list">
        <app-chat-list [id_user]="id_user" (id_chat_to_pass)="open_chat($event)"></app-chat-list>
    </div>
    <div class="content_chat">
        <app-messages-chat [id_user]="id_user" [id_chat]="id_chat_to_pass" *ngIf="chat_is_open"></app-messages-chat>
    </div>
</main>
