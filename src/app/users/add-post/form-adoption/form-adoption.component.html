<div class="mx-auto max-w-screen-xl px-4 py-16 sm:px-6 lg:px-8 flex justify-center">
    <div class="w-full sm:w-1/2">
      <form [formGroup]="form" (ngSubmit)="onSubmitForm()" action="#" class="mb-0 mt-4 space-y-4 rounded-lg p-4 shadow-lg sm:p-6 lg:p-8">
        <!-- INICIO FORM PT1 -->
        <div *ngIf="currentStep === 1" class="form-step1">
          <h1 class="text-center text-2xl mb-6 font-bold text-slate-800 sm:text-3xl">
            Datos básicos de la mascota
          </h1>
  
          <!-- Tipo de mascota (select) -->
          <label for="pet-type" class="block mb-2 text-sm font-medium text-gray-900 dark:text-black">Tipo de mascota</label>
          <select id="pet-type" formControlName="pet-type" class="mb-4 div-select-pet bg-gray-50 border text-gray-900 text-sm rounded-lg block w-full p-2.5">
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
          </select>
          <div *ngIf="form.get('pet-type')?.invalid && form.get('pet-type')?.touched" class="text-red-500 text-xs">
            El campo Tipo de mascota es obligatorio
          </div>
  
          <!-- Raza (select) -->
          <label for="pet-breed" class="block mb-2 text-sm font-medium text-gray-900 dark:text-black">Raza</label>
          <select id="pet-breed" formControlName="pet-breed" class="mb-4 div-select-pet bg-gray-50 border text-gray-900 text-sm rounded-lg block w-full p-2.5">
            <option value="pug">Pug</option>
            <option value="jej">Jej</option>
          </select>
          <div *ngIf="form.get('pet-breed')?.invalid && form.get('pet-breed')?.touched" class="text-red-500 text-xs">
            El campo Raza es obligatorio
          </div>
  
          <!-- Nombre de la mascota (text) -->
          <label for="pet-name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-black">Nombre de la mascota</label>
          <input type="text" id="pet-name" formControlName="pet-name" placeholder="Ingresa el nombre de tu mascota"
            class="mb-4 bg-gray-50 border text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:placeholder-gray-400 dark:text-black" required />
          <div *ngIf="form.get('pet-name')?.invalid && form.get('pet-name')?.touched" class="text-red-500 text-xs">
            El campo Nombre de la mascota es obligatorio
          </div>
  
          <!-- Edad (number) -->
          <label for="pet-age" class="block mb-2 text-sm font-medium text-gray-900 dark:text-black">Edad</label>
          <input type="number" id="pet-age" formControlName="pet-age" placeholder="Edad de tu mascota"
            class="mb-4 bg-gray-50 border text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:placeholder-gray-400 dark:text-black" required />
          <div *ngIf="form.get('pet-age')?.invalid && form.get('pet-age')?.touched" class="text-red-500 text-xs">
            El campo Edad es obligatorio
          </div>
  
          <!-- Sección de características físicas -->
          <div class="flex items-center space-x-4 justify-center mt-6 mb-4">
            <hr class="flex-grow" />
            <p class="text-center text-lg font-medium">Características físicas principales</p>
            <hr class="flex-grow" />
          </div>
  
          <div formArrayName="characteristics">
            <div *ngFor="let characteristic of characteristics.controls; let i = index" [formGroupName]="i" class="mb-2">
              <input formControlName="0" placeholder="Añade una característica"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5" />
            </div>
          </div>
          
          <button type="button" (click)="addCharacteristic()" class="text-blue-600 text-sm font-medium mt-2">
            + Agregar nueva característica
          </button>
  
          <br /><br />
  
          <!-- Botón Siguiente y Cancelar -->
          <button type="button" class="div-submit_color block w-full rounded-lg px-5 py-3 text-sm font-medium text-white mb-5" (click)="onNext()">
            Siguiente
          </button>
          <button type="reset" class="div-reset_color block w-full rounded-lg px-5 py-3 text-sm font-medium text-white">
            Cancelar
          </button>
  
          <br />
          <div class="flex justify-center mt-4">
            <img src="/assets/forms/dots1.svg" alt="" />
          </div>
        </div>
        <!-- INICIO FORM PT2 y FORM PT3 pueden ir aquí -->
      </form>
    </div>
  </div>
